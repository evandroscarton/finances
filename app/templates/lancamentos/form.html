{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if lancamento else 'Novo' }} Lançamento{% endblock %}
{% block conteudo %}
<div class="page-header">
    <h3>{{ 'Editar' if lancamento else 'Novo' }} Lançamento</h3>
</div>

<div class="form-panel">
    <form method="post">
        <!-- Campos ocultos com os filtros atuais da listagem, recebidos via
             querystring (GET). São reenviados no POST para que a rota saiba
             para onde redirecionar preservando o contexto de busca do usuário. -->
        <input type="hidden" name="f_conta_id" value="{{ request.args.get('conta_id', '') }}">
        <input type="hidden" name="f_cartao_id" value="{{ request.args.get('cartao_id', '') }}">
        <input type="hidden" name="f_categoria_id" value="{{ request.args.get('categoria_id', '') }}">
        <input type="hidden" name="f_status" value="{{ request.args.get('status', '') }}">
        <input type="hidden" name="f_data_inicio" value="{{ request.args.get('data_inicio', '') }}">
        <input type="hidden" name="f_data_fim" value="{{ request.args.get('data_fim', '') }}">

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Descrição</label>
                <input type="text" name="descricao" class="form-control"
                       value="{{ lancamento.descricao if lancamento else '' }}" required autofocus>
            </div>

            <div class="col-md-3">
                <label class="form-label">Tipo</label>
                <select name="tipo_valor" class="form-select" required>
                    <option value="entrada" {{ 'selected' if lancamento and lancamento.valor > 0 else '' }}>Entrada</option>
                    <option value="saida" {{ 'selected' if not lancamento or lancamento.valor < 0 else '' }}>Saída</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Valor (sem sinal)</label>
                <input type="number" step="0.01" min="0.01" name="valor" class="form-control"
                       value="{{ lancamento.valor|abs if lancamento else '' }}" required>
            </div>

            <!-- Origem: define se o lançamento pertence a uma CONTA ou a um CARTÃO -->
            <div class="col-12">
                <label class="form-label d-block">Origem do Lançamento</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="origem" id="origem_conta" value="conta"
                        {{ 'checked' if not lancamento or lancamento.conta_id else '' }}>
                    <label class="form-check-label" for="origem_conta">Conta</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="origem" id="origem_cartao" value="cartao"
                        {{ 'checked' if lancamento and lancamento.cartao_id else '' }}>
                    <label class="form-check-label" for="origem_cartao">Cartão de Crédito</label>
                </div>
            </div>

            <div class="col-md-6" id="grupo_conta">
                <label class="form-label">Conta</label>
                <select name="conta_id" class="form-select">
                    <option value="">-- Selecione --</option>
                    {% for c in contas %}
                    <option value="{{ c.id }}"
                        {{ 'selected' if lancamento and lancamento.conta_id == c.id else '' }}>
                        {{ c.nome }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6" id="grupo_cartao">
                <label class="form-label">Cartão de Crédito</label>
                <select name="cartao_id" class="form-select">
                    <option value="">-- Selecione --</option>
                    {% for c in cartoes %}
                    <option value="{{ c.id }}"
                        {{ 'selected' if lancamento and lancamento.cartao_id == c.id else '' }}>
                        {{ c.nome }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Categoria</label>
                <select name="categoria_id" class="form-select" required>
                    <option value="">-- Selecione --</option>
                    {% for c in categorias %}
                    <option value="{{ c.id }}"
                        {{ 'selected' if lancamento and lancamento.categoria_id == c.id else '' }}>
                        {{ c.nome }} ({{ c.tipo }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Data do Lançamento</label>
                <input type="date" name="data_lancamento" class="form-control"
                       value="{{ lancamento.data_lancamento.strftime('%Y-%m-%d') if lancamento else '' }}" required>
            </div>

            <div class="col-md-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select" required>
                    <option value="compensado" {{ 'selected' if lancamento and lancamento.status == 'compensado' else '' }}>Compensado</option>
                    <option value="pendente" {{ 'selected' if not lancamento or lancamento.status == 'pendente' else '' }}>Pendente</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Data de Compensação</label>
                <input type="date" name="data_compensacao" class="form-control"
                       value="{{ lancamento.data_compensacao.strftime('%Y-%m-%d') if lancamento and lancamento.data_compensacao else '' }}">
                <small class="text-muted">Deixe em branco se ainda não compensado.</small>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{{ url_for('lancamentos.listar',
                    conta_id=request.args.get('conta_id'), cartao_id=request.args.get('cartao_id'),
                    categoria_id=request.args.get('categoria_id'), status=request.args.get('status'),
                    data_inicio=request.args.get('data_inicio'), data_fim=request.args.get('data_fim')) }}"
               class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>

<!-- Alterna visualmente qual select fica habilitado conforme a origem escolhida -->
<script>
document.addEventListener('DOMContentLoaded', function () {
    const radioConta = document.getElementById('origem_conta');
    const radioCartao = document.getElementById('origem_cartao');
    const selectConta = document.querySelector('select[name="conta_id"]');
    const selectCartao = document.querySelector('select[name="cartao_id"]');

    function atualizar() {
        const isConta = radioConta.checked;
        selectConta.disabled = !isConta;
        selectCartao.disabled = isConta;
        if (!isConta) selectConta.value = "";
        if (isConta) selectCartao.value = "";
    }

    radioConta.addEventListener('change', atualizar);
    radioCartao.addEventListener('change', atualizar);
    atualizar();
});
</script>
{% endblock %}

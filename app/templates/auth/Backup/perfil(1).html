{% extends "base.html" %}
{% block titulo %}Meu Perfil{% endblock %}
{% block conteudo %}
<h3 class="mb-4">Meu Perfil</h3>

<div class="row g-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Dados Cadastrais</div>
            <div class="card-body">
                <form method="post" action="{{ url_for('auth.atualizar_perfil') }}">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" name="nome" class="form-control" value="{{ current_user.nome }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ current_user.email }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Salvar Dados</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Alterar Senha</div>
            <div class="card-body">
                <form method="post" action="{{ url_for('auth.alterar_senha') }}">
                    <div class="mb-3">
                        <label class="form-label">Senha Atual</label>
                        <input type="password" name="senha_atual" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nova Senha</label>
                        <input type="password" name="senha_nova" class="form-control" minlength="6" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirmar Nova Senha</label>
                        <input type="password" name="senha_confirmacao" class="form-control" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-warning">Alterar Senha</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block titulo %}Nova Transferência{% endblock %}
{% block conteudo %}
<h3 class="mb-4">Nova Transferência</h3>

<form method="post" class="row g-3" style="max-width: 500px;">
    <div class="col-12">
        <label class="form-label">Conta de Origem</label>
        <select name="conta_origem_id" class="form-select" required autofocus>
            <option value="">Selecione...</option>
            {% for c in contas %}
            <option value="{{ c.id }}">{{ c.nome }} — Saldo: R$ {{ "%.2f"|format(c.saldo_compensado) }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-12">
        <label class="form-label">Conta de Destino</label>
        <select name="conta_destino_id" class="form-select" required>
            <option value="">Selecione...</option>
            {% for c in contas %}
            <option value="{{ c.id }}">{{ c.nome }} — Saldo: R$ {{ "%.2f"|format(c.saldo_compensado) }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-6">
        <label class="form-label">Valor (R$)</label>
        <input type="number" step="0.01" min="0.01" name="valor" class="form-control" required>
    </div>
    <div class="col-6">
        <label class="form-label">Data</label>
        <input type="date" name="data" class="form-control" required>
    </div>
    <div class="col-12">
        <label class="form-label">Descrição (opcional)</label>
        <input type="text" name="descricao" class="form-control">
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-primary">Transferir</button>
        <a href="{{ url_for('transferencias.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}

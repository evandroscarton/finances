{% extends "base.html" %}
{% block titulo %}Novo Cartão{% endblock %}
{% block conteudo %}
<div class="page-header">
    <h3>Novo Cartão de Crédito</h3>
</div>

<div class="form-panel" style="max-width: 500px;">
    <form method="post" class="row g-3">
        <div class="col-12">
            <label class="form-label">Nome</label>
            <input type="text" name="nome" class="form-control" required autofocus>
        </div>
        <div class="col-12">
            <label class="form-label">Limite (R$)</label>
            <input type="number" step="0.01" min="0.01" name="limite" class="form-control" required>
        </div>
        <div class="col-6">
            <label class="form-label">Dia de Fechamento</label>
            <input type="number" min="1" max="31" name="dia_fechamento" class="form-control" required>
        </div>
        <div class="col-6">
            <label class="form-label">Dia de Vencimento</label>
            <input type="number" min="1" max="31" name="dia_vencimento" class="form-control" required>
        </div>
        <div class="col-12">
            <label class="form-label">Conta de Pagamento</label>
            <select name="conta_pagamento_id" class="form-select" required>
                <option value="">Selecione...</option>
                {% for conta in contas %}
                <option value="{{ conta.id }}">{{ conta.nome }} ({{ conta.banco }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{{ url_for('cartoes.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

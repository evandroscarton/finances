{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if previsto else 'Novo' }} Lançamento Previsto{% endblock %}
{% block conteudo %}
<div class="page-header">
    <h3>{{ 'Editar' if previsto else 'Novo' }} Lançamento Previsto</h3>
</div>

<div class="form-panel">
    <form method="post">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Descrição</label>
                <input type="text" name="descricao" class="form-control"
                       value="{{ previsto.descricao if previsto else '' }}" required autofocus>
            </div>

            <div class="col-md-3">
                <label class="form-label">Tipo</label>
                <select name="tipo_valor" class="form-select" required>
                    <option value="entrada" {{ 'selected' if previsto and previsto.valor > 0 else '' }}>Entrada</option>
                    <option value="saida" {{ 'selected' if not previsto or previsto.valor < 0 else '' }}>Saída</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Valor (sem sinal)</label>
                <input type="number" step="0.01" min="0.01" name="valor" class="form-control"
                       value="{{ previsto.valor|abs if previsto else '' }}" required>
            </div>

            <div class="col-12">
                <label class="form-label d-block">Origem do Lançamento</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="origem" id="origem_conta" value="conta"
                        {{ 'checked' if not previsto or previsto.conta_id else '' }}>
                    <label class="form-check-label" for="origem_conta">Conta</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="origem" id="origem_cartao" value="cartao"
                        {{ 'checked' if previsto and previsto.cartao_id else '' }}>
                    <label class="form-check-label" for="origem_cartao">Cartão de Crédito</label>
                </div>
            </div>

            <div class="col-md-6" id="grupo_conta">
                <label class="form-label">Conta</label>
                <select name="conta_id" class="form-select">
                    <option value="">-- Selecione --</option>
                    {% for c in contas %}
                    <option value="{{ c.id }}"
                        {{ 'selected' if previsto and previsto.conta_id == c.id else '' }}>
                        {{ c.nome }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6" id="grupo_cartao">
                <label class="form-label">Cartão de Crédito</label>
                <select name="cartao_id" class="form-select">
                    <option value="">-- Selecione --</option>
                    {% for c in cartoes %}
                    <option value="{{ c.id }}"
                        {{ 'selected' if previsto and previsto.cartao_id == c.id else '' }}>
                        {{ c.nome }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Categoria</label>
                <select name="categoria_id" class="form-select" required>
                    <option value="">-- Selecione --</option>
                    {% for c in categorias %}
                    <option value="{{ c.id }}"
                        {{ 'selected' if previsto and previsto.categoria_id == c.id else '' }}>
                        {{ c.nome }} ({{ c.tipo }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Diferença em relação ao lançamento normal: em vez de data única,
                 usa-se dia do mês + mês/ano de referência. Isso permite reutilizar
                 o mesmo registro em meses seguintes, apenas trocando o mes_ano. -->
            <div class="col-md-3">
                <label class="form-label">Dia do Mês</label>
                <select name="dia_mes" class="form-select" required>
                    {% for dia in range(1, 32) %}
                    <option value="{{ dia }}" {{ 'selected' if previsto and previsto.dia_mes == dia else '' }}>{{ dia }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Mês / Ano</label>
                <input type="month" name="mes_ano" class="form-control"
                       value="{{ previsto.mes_ano.strftime('%Y-%m') if previsto else '' }}" required>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" name="acao" value="salvar" class="btn btn-primary">Salvar</button>
            <button type="submit" name="acao" value="lancar" class="btn btn-success">Lançar</button>
            <a href="{{ url_for('lancamentos_previstos.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const radioConta = document.getElementById('origem_conta');
    const radioCartao = document.getElementById('origem_cartao');
    const selectConta = document.querySelector('select[name="conta_id"]');
    const selectCartao = document.querySelector('select[name="cartao_id"]');

    function atualizar() {
        const isConta = radioConta.checked;
        selectConta.disabled = !isConta;
        selectCartao.disabled = isConta;
        if (!isConta) selectConta.value = "";
        if (isConta) selectCartao.value = "";
    }

    radioConta.addEventListener('change', atualizar);
    radioCartao.addEventListener('change', atualizar);
    atualizar();
});
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Editar' if categoria else 'Nova' }} Categoria</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f5f7;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        h1 {
            margin-top: 0;
            color: #222;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .acoes {
            margin-top: 25px;
        }
        .btn {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }
        .btn-salvar { background: #2563eb; color: #fff; }
        .btn-cancelar { background: #ccc; color: #333; margin-left: 8px; }

        .flash {
            padding: 10px 14px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .flash.erro { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ 'Editar Categoria' if categoria else 'Nova Categoria' }}</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for categoria_msg, mensagem in messages %}
                <div class="flash {{ categoria_msg }}">{{ mensagem }}</div>
            {% endfor %}
        {% endwith %}

        <form method="post">
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" name="descricao" maxlength="50" value="{{ descricao }}" required>

            <div class="acoes">
                <button class="btn btn-salvar" type="submit">Salvar</button>
                <a class="btn btn-cancelar" href="{{ url_for('categorias_index') }}">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>

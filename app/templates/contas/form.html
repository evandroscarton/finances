{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if conta else 'Nova' }} Conta{% endblock %}
{% block conteudo %}
<div class="page-header">
    <h3>{{ 'Editar Conta' if conta else 'Nova Conta' }}</h3>
</div>

<div class="form-panel" style="max-width: 500px;">
    <form method="post" class="row g-3">
        <div class="col-12">
            <label class="form-label">Nome</label>
            <input type="text" name="nome" class="form-control" value="{{ conta.nome if conta else '' }}" required autofocus>
        </div>
        <div class="col-12">
            <label class="form-label">Banco</label>
            <input type="text" name="banco" class="form-control" value="{{ conta.banco if conta else '' }}">
        </div>
        <div class="col-12">
            <label class="form-label">Tipo</label>
            <select name="tipo" class="form-select" required>
                {% set tipo_atual = conta.tipo if conta else '' %}
                <option value="corrente" {{ 'selected' if tipo_atual == 'corrente' else '' }}>Corrente</option>
                <option value="poupanca" {{ 'selected' if tipo_atual == 'poupanca' else '' }}>Poupança</option>
                <option value="carteira" {{ 'selected' if tipo_atual == 'carteira' else '' }}>Carteira</option>
            </select>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{{ url_for('contas.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
